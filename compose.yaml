# 本机开发数据库。启动：docker compose up -d；口令读自 .env 的 POSTGRES_PASSWORD
name: shopilot
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopilot
      POSTGRES_DB: shopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["127.0.0.1:5460:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shopilot -d shopilot]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
